# Hindsight on Fly.io — durable long-term memory for OmniRoute.
#
# Hindsight is deployed from a pinned upstream image; this repository does not
# build it. Deploy with:
#   fly deploy --config deploy/fly/hindsight.fly.toml
#
# The image and the LLM chain are pinned in this file on purpose: memory written
# into a Hindsight bank outlives deployments, so the writer version must be
# reproducible and the schema must advance only through Hindsight's own
# migrations.
#
# NO [http_service] BY DESIGN. Hindsight has no public surface; OmniRoute reaches
# it at http://omniroute-hindsight.internal:8888 over Fly 6PN private networking.

app = "omniroute-hindsight"
primary_region = "ord"

[build]
  # Pinned, not `latest`: the running version must be auditable and upgradeable
  # deliberately. All endpoints the OmniRoute adapter uses were verified present
  # in this release (GET /health, POST .../memories, POST .../memories/recall,
  # GET .../memories/list, GET/PATCH .../memories/{id}, GET|DELETE .../documents,
  # POST .../reflect).
  image = "ghcr.io/vectorize-io/hindsight:0.8.6"

[env]
  # MUST be "::", not "0.0.0.0". Fly's 6PN private network is IPv6-only, and
  # binding 0.0.0.0 makes uvicorn create an AF_INET socket only — the API then
  # answers on 127.0.0.1:8888 but refuses the machine's fdaa:... address, which
  # is exactly how this first deployed (OmniRoute saw ECONNREFUSED on every
  # 6PN request while the container's own /health was healthy).
  # "::" dual-stacks on Linux, so both loopback and 6PN keep working.
  HINDSIGHT_API_HOST = "::"
  HINDSIGHT_API_PORT = "8888"
  HINDSIGHT_ENABLE_API = "true"
  # The bundled control plane is kept for inspecting stored memory. It listens on
  # 9999 and is likewise private — no Fly service is published for it.
  HINDSIGHT_ENABLE_CP = "true"
  HINDSIGHT_API_LOG_LEVEL = "info"
  # First boot downloads the embedded PostgreSQL distribution and loads the local
  # embedding/reranker models; the entrypoint waits this long before giving up.
  HINDSIGHT_API_STARTUP_WAIT_SECONDS = "900"

  # Stable worker id — the entrypoint warns loudly when it falls back to the
  # container hostname, because that changes on every restart and can strand
  # claimed async operations.
  HINDSIGHT_API_WORKER_ID = "hindsight-omniroute"
  HINDSIGHT_API_WORKER_MAX_SLOTS = "6"

  # ── LLM chain (retain/reflect/consolidation) ───────────────────────────────
  # Provider + API key come from Fly secrets (HINDSIGHT_API_LLM_API_KEY and the
  # per-member keys below). Model ids are not secret and are pinned here.
  #
  # HINDSIGHT_API_LLM_MODEL is the first member; LLM_<n>_MODEL are the failovers.
  # Indices MUST be contiguous from 1: Hindsight stops scanning at the first index
  # whose _PROVIDER is unset (config.py::_parse_llm_members), so a gap silently
  # truncates the chain.
  #
  # Every id below was probed against OpenRouter on 2026-10-05 and answered 200.
  # Ordered cheapest-capable-first, with the free models as *failovers*:
  #
  #   deepseek-v4.1-flash           $0.003/M in, ~3.5s, honours strict JSON
  #   ling-3.0-flash-fin            $0.042/M in, ~1.6s, concise
  #   deepseek-v4-flash-0731        $0.005/M in
  #   deepseek-v4-flash             $0.011/M in
  #   qwen3.7-flash                 $0.03/M in
  #   glm-5.3-flash                 $0.15/M in
  #   nemotron-3.5-lightning:free   free
  #   dots-3-note-preview:free      free
  #   ling-3.0-flash-vl             $0.021/M in (vision variant, kept as a fallback)
  #
  # Why the FREE models are not first, despite being cheapest. Measured on this
  # deployment: both free models answer quickly in isolation (~8s) but emit prose
  # ("Let me analyse this text chunk carefully...") instead of the strict JSON that
  # HINDSIGHT_API_LLM_STRICT_SCHEMA requires, so Hindsight retries and a retain led
  # by them ran past 120s — past the OmniRoute-side retain timeout, which then fell
  # back to SQLite and wrote the memory to the wrong store. They are excellent
  # failovers (zero cost, and failover only runs when the cheap model errors), and
  # a poor lead. Note the top three are all under $0.01/M input, so the cost
  # difference is small in absolute terms.
  #
  # NOT included: thinkingmachines/inkling:free and inkling-small:free both return
  # 403 "only available on agentic harnesses". A retired/blocked model is the one
  # failure the failover chain cannot rescue, because it is not transient — the
  # original deployment led with minimax/minimax-m3:free, which now 404s, and every
  # retain failed outright. Re-probe before adding a member.
  #
  # opencode's free tier is not usable here either: routing it through OmniRoute
  # returns 403 "OpenCode's free tier can only be used from within OpenCode".
  HINDSIGHT_API_LLM_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_MODEL = "deepseek/deepseek-v4.1-flash"
  HINDSIGHT_API_LLM_STRATEGY = '{"mode":"failover"}'
  HINDSIGHT_API_LLM_STRICT_SCHEMA = "true"
  HINDSIGHT_API_LLM_EXTRA_BODY = '{"max_tokens":2000}'
  HINDSIGHT_API_LLM_MAX_CONCURRENT = "8"
  HINDSIGHT_API_LLM_MAX_RETRIES = "2"
  HINDSIGHT_API_LLM_INITIAL_BACKOFF = "1"
  HINDSIGHT_API_LLM_MAX_BACKOFF = "5"
  HINDSIGHT_API_LLM_TIMEOUT = "180"

  HINDSIGHT_API_LLM_1_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_1_MODEL = "inclusionai/ling-3.0-flash-fin"
  HINDSIGHT_API_LLM_2_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_2_MODEL = "deepseek/deepseek-v4-flash-0731"
  HINDSIGHT_API_LLM_3_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_3_MODEL = "deepseek/deepseek-v4-flash"
  HINDSIGHT_API_LLM_4_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_4_MODEL = "qwen/qwen3.7-flash"
  HINDSIGHT_API_LLM_5_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_5_MODEL = "z-ai/glm-5.3-flash"
  HINDSIGHT_API_LLM_6_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_6_MODEL = "nvidia/nemotron-3.5-lightning:free"
  HINDSIGHT_API_LLM_7_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_7_MODEL = "dots-studio/dots-3-note-preview:free"
  HINDSIGHT_API_LLM_8_PROVIDER = "openrouter"
  HINDSIGHT_API_LLM_8_MODEL = "inclusionai/ling-3.0-flash-vl"

# All Hindsight state that must survive a restart/redeploy: the embedded
# PostgreSQL cluster, its WAL, and pg0's cached server distribution.
[[mounts]]
  source = "hindsight_data"
  destination = "/home/hindsight/.pg0"

# No [[http_service]] and no [[checks]] on purpose. A check that fires while the
# first boot is still unpacking PostgreSQL / loading models would put the machine
# into a restart loop that never finishes initialising. Liveness comes from the
# entrypoint itself: /app/start-all.sh exits non-zero when the API fails to come
# up, which Fly treats as a crash and restarts. Memory-service health is
# surfaced where it is actionable — OmniRoute's GET /api/memory/backends.

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
